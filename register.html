<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Citizen Registration | NagarDrishti</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <a href="index.html" class="logo">
        Nagar<span>Drishti</span>
    </a>

    <nav>
        <a href="login.html">Login</a>
    </nav>

</header>


<div class="form-page">

    <form id="registerForm" class="form-card">

        <h2>Create Citizen Account</h2>

        <p>
            Register to report and track civic problems.
        </p>

        <label>Full Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
        >


        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Create password"
            required
        >


        <label>Confirm Password</label>

        <input
            type="password"
            id="confirm"
            placeholder="Confirm password"
            required
        >


        <button class="btn" type="submit">
            Register
        </button>


        <div id="message"></div>


        <p>
            Already registered?
            <a href="login.html">Login</a>
        </p>

    </form>

</div>


<script src="js/auth.js"></script>

</body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acknowledgement | NagarDrishti</title><link rel="stylesheet" href="css/style.css"></head>
<body><header><a class="logo" href="index.html">Nagar<span>Drishti</span></a></header><div class="slip-page"><div id="slip" class="slip"><h1>NagarDrishti</h1><h2>Acknowledgement Slip</h2><div class="tracking" id="tracking"></div><div id="details"></div><p class="success">✓ Complaint registered successfully</p><p>Save your Tracking ID to check complaint status.</p><div class="actions"><button class="btn" onclick="window.print()">Print Slip</button><a class="btn secondary" href="track.html">Track Complaint</a></div></div></div><script>const d=JSON.parse(localStorage.getItem('lastComplaint')||'null'); if(!d){document.getElementById('details').innerHTML='<p>No complaint data found.</p>'}else{document.getElementById('tracking').textContent=d.tracking_id;document.getElementById('details').innerHTML=`<div class="details"><p><b>Complaint ID:</b> #${d.report_id}</p><p><b>Problem Type:</b> ${d.problem_type||'-'}</p><p><b>Status:</b> ${d.status}</p><p><b>Priority Score:</b> ${d.priority_score}</p><p><b>Date:</b> ${new Date().toLocaleString()}</p></div>`}</script></body></html>

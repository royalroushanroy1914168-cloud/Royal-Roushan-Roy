<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Department Dashboard | NagarDrishti</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>


<body>

<header>

<a href="index.html" class="logo">
    Nagar<span>Drishti</span>
</a>


<nav>

<button
    id="logout"
    class="link-btn"
>
    Logout
</button>

</nav>

</header>


<main class="dashboard">

<h1>
    Department Dashboard
</h1>


<p>
    Manage and resolve citizen complaints.
</p>


<div
    id="stats"
    class="stats"
>
</div>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>
    Tracking ID
</th>

<th>
    Citizen
</th>

<th>
    Problem
</th>

<th>
    Location
</th>

<th>
    Priority
</th>

<th>
    Status
</th>

<th>
    Action
</th>

</tr>

</thead>


<tbody id="reports">
</tbody>

</table>

</div>

</main>


<script src="js/department.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Citizen Login | NagarDrishti</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <a href="index.html" class="logo">
        Nagar<span>Drishti</span>
    </a>

    <nav>

        <a href="register.html">
            Register
        </a>

        <a href="department-login.html">
            Department Login
        </a>

    </nav>

</header>


<div class="form-page">

    <form id="loginForm" class="form-card">

        <h2>Citizen Login</h2>

        <p>
            Login to report and track your complaints.
        </p>


        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter email"
            required
        >


        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >


        <button class="btn" type="submit">
            Login
        </button>


        <div id="message"></div>


        <p>
            New citizen?
            <a href="register.html">
                Create account
            </a>
        </p>

    </form>

</div>


<script src="js/auth.js"></script>

</body>
</html>

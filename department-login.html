<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Department Login | NagarDrishti</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>


<body>

<header>

<a href="index.html" class="logo">
    Nagar<span>Drishti</span>
</a>

<nav>
<a href="index.html">Home</a>
<a href="login.html">
    Citizen Login
</a>

</nav>

</header>


<div class="form-page">

<form
    id="departmentLoginForm"
    class="form-card"
>

<div class="badge">
    AUTHORIZED ACCESS
</div>


<h2>
    Department Login
</h2>


<p>
    Authorized civic department personnel only.
</p>


<label>
    Department Email
</label>

<input
    type="email"
    id="email"
    placeholder="department@nagardrishti.gov.in"
    required
>


<label>
    Password
</label>

<input
    type="password"
    id="password"
    placeholder="Enter department password"
    required
>


<button
    class="btn"
    type="submit"
>
    Department Login
</button>


<div id="message"></div>

</form>

</div>


<script src="js/auth.js"></script>

</body>
</html>
